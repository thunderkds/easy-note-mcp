[package]
name = "easy-note-mcp"
version = "0.1.0"
edition = "2021"
description = "Capture one-line notes from the terminal and from MCP clients into a folder of Markdown files."
license = "MIT"
publish = false

[[bin]]
name = "easy-note"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
rmcp = { version = "3.10", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
serde_json = "1"
