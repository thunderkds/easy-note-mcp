[package]
name = "easy-note-mcp"
version = "0.1.0"
edition = "2021"
description = "Capture one-line notes from the terminal and from MCP clients into a folder of Markdown files."
license = "MIT"
publish = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[[bin]]
name = "easy-note"
path = "src/main.rs"

[dependencies]
caseless = "0.2.2"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6", features = ["derive"] }
gethostname = "1.1.0"
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
rmcp = { version = "3.10", default-features = false, features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
saphyr = "0.3.4"
saphyr-parser = "0.3.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1", features = ["rt", "net", "time"] }
toml = "1.2.1"
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
regex = "1"
url = "2"
percent-encoding = "2"
wait-timeout = "0.2"
ksni = { version = "0.3.7", optional = true, features = ["blocking"] }
zbus = { version = "5", optional = true, default-features = false, features = ["blocking-api"] }
wry = { version = "0.57.3", optional = true }
tao = { version = "0.37.3", optional = true }

[features]
tray = ["dep:ksni", "dep:zbus"]
window = ["dep:wry", "dep:tao"]

[dev-dependencies]
rmcp = { version = "3.10", default-features = false, features = ["client", "transport-child-process"] }
tokio = { version = "1", features = ["rt", "net", "macros", "time", "process"] }
tempfile = "3"
