[package]
name = "easy-note-mcp"
version = "0.1.0"
edition = "2021"
description = "Capture one-line notes from the terminal and from MCP clients into a folder of Markdown files."
license = "MIT"
publish = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[[bin]]
name = "easy-note"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6", features = ["derive"] }
gethostname = "1.1.0"
rmcp = { version = "3.10", default-features = false, features = ["server", "transport-io"] }
saphyr = "0.3.4"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1", features = ["rt"] }
toml = "1.2.1"

[dev-dependencies]
serde_json = "1"
